name: release

# Cutting a release is `git tag v0.1.1 && git push --tags`. Everything below
# is what was previously done by hand: build, sign, write the manifest, upload.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# One release build at a time, per tag. Two runs for the same tag both publish
# to the same release, and the loser can leave a latest.json describing an
# installer the winner replaced -- a signature mismatch, which every client
# reads as a refused update.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Windows only, by choice rather than by omission: the game this was built
    # for runs nowhere else. A build matrix is the change if that stops being
    # true -- Tauri can only target the platform it builds on.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Rust is most of the build time and almost none of what changes between
      # releases.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: npm ci

      - name: Refuse a tag that disagrees with the version
        shell: bash
        run: |
          TAGGED="${GITHUB_REF_NAME#v}"
          DECLARED=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "$TAGGED" != "$DECLARED" ]; then
            echo "Tag $GITHUB_REF_NAME does not match tauri.conf.json version $DECLARED."
            echo "The updater compares against the declared version, so a mismatch"
            echo "ships an update that installs and then offers itself again."
            exit 1
          fi

      # The client is built for one deployment: VITE_API_URL is where it calls,
      # and the updater endpoint is where it looks for its own next version.
      # Both are derived from the same variable here rather than set twice,
      # because a client that talks to one host and updates from another is a
      # client that can be told it is current by a deployment that is not
      # serving it.
      - name: Refuse a build with nowhere to talk to
        shell: bash
        run: |
          if [ -z "${{ vars.VITE_API_URL }}" ]; then
            echo "The repository variable VITE_API_URL is not set."
            echo "It is compiled into the installer, so a build without it ships a"
            echo "client pointed at localhost and an updater pointed at nothing."
            exit 1
          fi

      - name: Point the updater at this deployment
        shell: bash
        working-directory: apps/desktop
        run: |
          cat > updater.endpoint.json <<'EOF'
          {
            "plugins": {
              "updater": {
                "endpoints": ["${{ vars.VITE_API_URL }}/download/latest.json"]
              }
            }
          }
          EOF
          cat updater.endpoint.json

      - name: Build and sign
        working-directory: apps/desktop
        run: npm run tauri build -- --config updater.endpoint.json
        env:
          # The private half of the updater keypair. Without it the installers
          # still build but carry no signature, and every client refuses them.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Where the shipped client will look for its server.
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Write latest.json
        working-directory: apps/desktop
        run: >
          npm run release:manifest --
          --tag "${{ github.ref_name }}"
          --notes "${{ github.ref_name }}"
          --endpoint "${{ vars.VITE_API_URL }}/download/latest.json"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/latest.json
