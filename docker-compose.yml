# Pinned so Compose does not derive the project name from the folder. Without
# this, renaming the checkout directory creates fresh volumes and the existing
# database appears to vanish.
name: suddenqueue

services:
  postgres:
    image: postgres:17-alpine
    container_name: suddenqueue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: suddenqueue
      POSTGRES_PASSWORD: suddenqueue_dev
      POSTGRES_DB: suddenqueue
    ports:
      - "5432:5432"
    volumes:
      - suddenqueue-pgdata:/var/lib/postgresql/data
    healthcheck:
      # Compose waits on this before dependent services start, so migrations
      # never race an unready database.
      test: ["CMD-SHELL", "pg_isready -U suddenqueue -d suddenqueue"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  suddenqueue-pgdata:
